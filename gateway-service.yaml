apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: microservices
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: node-microservices-demo
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-service
        app.kubernetes.io/part-of: node-microservices-demo
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: gateway-service
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          command: ["node"]
          args:
            - "-e"
            - |
              const http = require('http');
              const port = Number(process.env.PORT || 3003);
              const service = process.env.SERVICE_NAME || 'gateway-service';
              const targets = {
                users: process.env.USER_SERVICE_URL,
                products: process.env.PRODUCT_SERVICE_URL,
                orders: process.env.ORDER_SERVICE_URL
              };
              const send = (res, status, body) => {
                res.writeHead(status, { 'content-type': 'application/json' });
                res.end(JSON.stringify(body));
              };
              async function getJson(url) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 2500);
                try {
                  const response = await fetch(url, { signal: controller.signal });
                  if (!response.ok) throw new Error(`${url} returned ${response.status}`);
                  return await response.json();
                } finally { clearTimeout(timer); }
              }
              async function proxy(req, res, target) {
                const destination = new URL(req.url, target);
                console.log(`Proxying ${req.method} ${req.url} -> ${destination.href}`);
                const upstream = http.request(destination, { method: req.method, headers: { accept: req.headers.accept || 'application/json' } }, response => {
                  res.writeHead(response.statusCode || 502, response.headers);
                  response.pipe(res);
                });
                upstream.setTimeout(3000, () => upstream.destroy(new Error('Upstream timeout')));
                upstream.on('error', error => send(res, 502, { error: 'Bad gateway', detail: error.message, service }));
                req.pipe(upstream);
              }
              const server = http.createServer(async (req, res) => {
                const path = new URL(req.url, 'http://localhost').pathname;
                console.log(`${new Date().toISOString()} ${req.method} ${path}`);
                try {
                  if (path === '/health') return send(res, 200, { status: 'ok', service });
                  if (path === '/ready') {
                    await Promise.all(Object.values(targets).map(url => getJson(`${url}/health`)));
                    return send(res, 200, { status: 'ready', service, dependencies: Object.keys(targets) });
                  }
                  if (path === '/') return send(res, 200, {
                    service,
                    message: 'Node.js microservices gateway',
                    routes: ['/api/users', '/api/products', '/api/orders', '/aggregate']
                  });
                  if (path === '/aggregate') {
                    const [users, products, orders] = await Promise.all([
                      getJson(`${targets.users}/api/users`),
                      getJson(`${targets.products}/api/products`),
                      getJson(`${targets.orders}/api/orders`)
                    ]);
                    return send(res, 200, { service, users, products, orders });
                  }
                  if (path.startsWith('/api/users')) return proxy(req, res, targets.users);
                  if (path.startsWith('/api/products')) return proxy(req, res, targets.products);
                  if (path.startsWith('/api/orders')) return proxy(req, res, targets.orders);
                  return send(res, 404, { error: 'Route not found', service, path });
                } catch (error) {
                  console.error(`Gateway dependency error: ${error.message}`);
                  return send(res, 503, { error: 'Gateway dependency unavailable', detail: error.message, service });
                }
              });
              server.listen(port, '0.0.0.0', () => console.log(`${service} listening on ${port}`));
              process.on('SIGTERM', () => server.close(() => process.exit(0)));

          ports:
            - name: http
              containerPort: 3003
              protocol: TCP
          env:
            - name: PORT
              value: "3003"
            - name: SERVICE_NAME
              value: "gateway-service"
            - name: USER_SERVICE_URL
              value: "http://user-service:3000"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:3001"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:3002"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
